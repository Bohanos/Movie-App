<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The best movie app</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <h1>Movie Hub</h1>
        <div>
            <input type="text" placeholder="Search for movies..."><button><i class="fas fa-search"></i></button>
        </div>
    </header>
    <section class="popular-movies">
        <p>Popular Movies</p>
        <div class="movie-card">
            <img src="images/movie-1.png" alt="Movie-Poster">
            <h2>Action Warrior</h2>
            <div class="ratings">Rating: 7.8<i class="fas fa-star"></i></div>
        </div>
        <div class="movie-card">
            <img src="images/movie-2.png" alt="Movie-Poster">
            <h2>Mystic Journey</h2>
            <div class="ratings">Rating: 8.2<i class="fas fa-star"></i></div>
        </div>
        <div class="movie-card">
            <img src="images/movie-3.png" alt="Movie-Poster">
            <h2>Space Invasion</h2>
            <div class="ratings">Rating: 7.5<i class="fas fa-star"></i></div>
        </div>
        <div class="movie-card">
            <img src="images/movie-4.png" alt="Movie-Poster">
            <h2>Jungle Beast</h2>
            <div class="ratings">Rating: 8.0<i class="fas fa-star"></i></div>
        </div>
         <div class="movie-card">
            <img src="images/movie-5.png" alt="Movie-Poster">
            <h2>Romantic Sunset</h2>
            <div class="ratings">Rating: 7.6<i class="fas fa-star"></i></div>
        </div>
        <div class="movie-card">
            <img src="images/movie-6.png" alt="Movie-Poster">
            <h2>Detective Secrets</h2>
            <div class="ratings">Rating: 8.4<i class="fas fa-star"></i></div>
        </div>
        <div class="movie-card">
            <img src="images/movie-7.png" alt="Movie-Poster">
            <h2>Funny Adventures</h2>
            <div class="ratings">Rating: 7.3<i class="fas fa-star"></i></div>
        </div>
        <div class="movie-card">
            <img src="images/movie-8.png" alt="Movie-Poster">
            <h2>Epic Quest</h2>
            <div class="ratings">Rating: 8.1<i class="fas fa-star"></i></div>
        </div>       
    </section>
        
</body>
<script src="js/custom.js"></script>
</html>
